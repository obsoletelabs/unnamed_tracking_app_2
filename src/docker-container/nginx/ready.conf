user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Only /api/ accepts large uploads; everything else keeps a small body limit.
    client_max_body_size 1m;
    error_log /dev/stderr warn;
    access_log off;
    sendfile on;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        location = /favicon.ico {
            log_not_found off;
            access_log off;
            return 302 /_startup/favicon.svg;
        }

        location = /_startup/status.json {
            alias /run/unnamed-tracking/status.json;
            add_header Cache-Control "no-store";
        }

        location = /_startup/details.txt {
            alias /run/unnamed-tracking/details.txt;
            add_header Cache-Control "no-store";
        }

        location = /_startup/startup.css {
            alias /srv/startup/startup.css;
        }

        location = /_startup/startup.js {
            alias /srv/startup/startup.js;
        }

        location = /_startup/startup.html {
            alias /srv/startup/startup.html;
        }

        location /_startup/ {
            return 404;
        }

        # Public host-owned PWA infrastructure must precede SPA fallback.
        location = /service-worker.js { proxy_pass http://127.0.0.1:8000; }
        location = /manifest.webmanifest { proxy_pass http://127.0.0.1:8000; }
        location /pwa/ { proxy_pass http://127.0.0.1:8000; }

        # --- Backend API ---
        location = /api {
            default_type application/json;
            return 404 '{"detail":"Not Found"}';
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            # Stream bodies; the backend checks credentials before reading a large one.
            proxy_request_buffering off;
            # Per-route application limits control uploads, including large save archives.
            client_max_body_size 0;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            # The real-ip module has validated the proxy chain; forward only its result.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Large archives are copied into storage after their upload completes.
            proxy_read_timeout 600s;
            proxy_send_timeout 60s;
        }

        location / {
            root /srv/frontend;
            try_files $uri $uri/ /index.html;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }
    }
}
