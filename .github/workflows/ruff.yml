name: Ruff
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: src/backend

jobs:
  ruff-format:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/changed-files
        id: changes
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.backend == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - name: Install Ruff
        if: steps.changes.outputs.backend == 'true'
        run: python -m pip install ruff
      - name: Check Ruff formatting
        run: python3 ../../tools/ci_checks.py backend-format

  ruff-lint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/changed-files
        id: changes
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.backend == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - name: Install Ruff
        if: steps.changes.outputs.backend == 'true'
        run: python -m pip install ruff
      - name: Run Ruff lint
        run: python3 ../../tools/ci_checks.py backend-lint

  # One writer applies both transformations; checks still run on the submitted commit.
  ruff-autofix:
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: quality-autofix-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/changed-files
        id: changes
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.backend == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - name: Install Ruff
        if: steps.changes.outputs.backend == 'true'
        run: python -m pip install ruff
      - name: Apply Ruff safe fixes
        id: fixes
        run: |
          # Remaining lint findings belong to ruff-lint; tool failures still fail this step.
          python3 ../../tools/ci_checks.py backend-lint-fix
      - name: Apply Ruff formatting
        if: ${{ !cancelled() }}
        run: python3 ../../tools/ci_checks.py backend-format-fix
      - name: Commit Ruff fixes to the PR branch
        if: ${{ !cancelled() && steps.fixes.outcome == 'success' }}
        working-directory: .
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git add -- src/backend
          if git diff --cached --quiet; then
            exit 0
          fi
          git fetch origin "refs/heads/$PR_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$EXPECTED_HEAD" ]; then
            echo "::notice::The PR branch advanced; a newer run will apply Ruff fixes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: apply Ruff safe fixes and formatting"
          git push origin "HEAD:refs/heads/$PR_BRANCH"
