name: Documentation
on:
  workflow_call:

permissions:
  contents: read

jobs:
  strict-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wiki/requirements.txt
      - run: python -m pip install -r wiki/requirements.txt
      - run: mkdocs build --strict --config-file wiki/mkdocs.yml
