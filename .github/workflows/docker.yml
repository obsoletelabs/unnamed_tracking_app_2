name: Build and push Docker images
on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: backend
            context: ./src/backend
            dockerfile: ./src/backend/dockerfile
          - name: frontend
            context: ./src/frontend
            dockerfile: ./src/frontend/Dockerfile
          # The runtime is published under its original name and under its new one. The original
          # keeps working but logs where to move to, so nobody is stranded while it is phased out.
          - name: plugin-runtime
            context: .
            dockerfile: src/plugin-runtime/Dockerfile
            replacement: unnamed_tracking_plugin_runtime
          - name: plugin-runtime-current
            context: .
            dockerfile: src/plugin-runtime/Dockerfile
            image: unnamed_tracking_plugin_runtime
            cache: plugin-runtime
          - name: wikicontainer
            context: .
            dockerfile: src/wikicontainer/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image names
        env:
          IMAGE: ${{ matrix.image }}
          NAME: ${{ matrix.name }}
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          REPO_LC="${GITHUB_REPOSITORY,,}"
          if [ -n "$IMAGE" ]; then
            echo "IMAGE_REF=ghcr.io/${OWNER_LC}/${IMAGE}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_REF=ghcr.io/${REPO_LC}-${NAME}" >> "$GITHUB_ENV"
          fi
          echo "OWNER_LC=${OWNER_LC}" >> "$GITHUB_ENV"

      - name: Resolve release tags
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            echo "metadata<<TAGS_END"
            python3 tools/release_tags.py "$GITHUB_REF_NAME" | sed 's/^/type=raw,value=/'
            echo "TAGS_END"
          } >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REF }}
          flavor: latest=false
          # Release tags (stable, beta, preview) come from tools/release_tags.py.
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=sha,format=long
            ${{ steps.release.outputs.metadata }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.replacement && format('REPLACEMENT_IMAGE=ghcr.io/{0}/{1}', env.OWNER_LC, matrix.replacement) || '' }}
          cache-from: type=gha,scope=${{ matrix.cache || matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache || matrix.name }}
