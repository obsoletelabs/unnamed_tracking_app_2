name: Deployment backup recovery
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 2"
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install operator test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y restic openssh-client
          python -m pip install ruff
      - name: Check backup tooling
        run: |
          ruff check --config src/backend/ruff.toml tools/backup_deployment.py tools/deployment_backups tools/check_deployment_backups.py tools/check_migration_backups.py tools/tests/test_deployment_backups.py
          ruff format --check --config src/backend/ruff.toml tools/backup_deployment.py tools/deployment_backups tools/check_deployment_backups.py tools/check_migration_backups.py tools/tests/test_deployment_backups.py
          RUN_RESTIC_TESTS=1 python -m unittest discover -s tools/tests -p test_deployment_backups.py -v
      - name: Build disposable deployment images
        run: |
          docker build -t backup-drill-app -f src/backend/dockerfile src/backend
          docker build -t backup-drill-runtime -f src/plugin-runtime/Dockerfile .
          docker build -t backup-drill-sftp -f tools/backup_acceptance/Dockerfile.sftp tools/backup_acceptance
      - name: Prove populated off-host recovery after removing original volumes
        run: python tools/check_deployment_backups.py --app-image backup-drill-app --runtime-image backup-drill-runtime --sftp-image backup-drill-sftp

      - name: Prove verified recovery before a pending upgrade
        run: python tools/check_migration_backups.py --app-image backup-drill-app --runtime-image backup-drill-runtime --sftp-image backup-drill-sftp
