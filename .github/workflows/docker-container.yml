name: Build and test production Docker container
on:
  workflow_call:

permissions:
  contents: read
  packages: write


jobs:
  Package-Production-Container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Dynamically derive repo name (lowercase)
      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # A registry or cache hiccup on a base image pull gets one retry.
      - name: Build production image for validation
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/docker-container/Dockerfile
          load: true
          tags: unnamed_tracking_app:ci
          cache-from: type=gha,scope=production-container
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=production-container' || '' }}

      - name: Wait before retrying
        if: steps.build.outcome == 'failure'
        run: sleep 30

      - name: Build production image for validation (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/docker-container/Dockerfile
          load: true
          tags: unnamed_tracking_app:ci
          cache-from: type=gha,scope=production-container
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=production-container' || '' }}


      - name: Validate production Nginx and TLS configuration
        run: docker run --rm --entrypoint /bin/sh unnamed_tracking_app:ci /opt/production-tests/test-nginx-config.sh

      - name: Validate production shell scripts and healthcheck
        run: |
          docker run --rm --entrypoint /bin/sh unnamed_tracking_app:ci -n /app/entrypoint.sh
          docker run --rm --entrypoint /bin/sh unnamed_tracking_app:ci -n /usr/local/bin/render-production-nginx
          docker inspect unnamed_tracking_app:ci --format '{{json .Config.Healthcheck.Test}}' | grep -F 'overall'

      - name: Reject CRLF in shell scripts
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys

          files = subprocess.check_output(["git", "ls-files", "*.sh"], text=True).splitlines()
          bad = [path for path in files if b"\r" in pathlib.Path(path).read_bytes()]
          if bad:
              print("CR/CRLF line endings found in shell scripts:", *bad, sep="\n", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Publish production image
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          # Dynamic GHCR image name
          IMAGE_NAME="ghcr.io/${REPO_LC}"

          # Tag formatting
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            IMAGE_TAG="pr-${PR_NUMBER}"
            BRANCH_TAG="$(printf '%s' "$HEAD_REF" | sed 's/[^A-Za-z0-9_.-]/-/g; s/^[-.]*//' | cut -c1-128)"
          else
            IMAGE_TAG="$(printf '%s' "$GITHUB_REF_NAME" | tr '/:' '-')"
          fi

          # Tag and push
          docker tag unnamed_tracking_app:ci "$IMAGE_NAME:$IMAGE_TAG"
          docker tag unnamed_tracking_app:ci "$IMAGE_NAME:sha-$GITHUB_SHA"

          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:sha-$GITHUB_SHA"

          # Pull requests are also reachable by their branch name.
          if [ -n "${BRANCH_TAG:-}" ]; then
            docker tag unnamed_tracking_app:ci "$IMAGE_NAME:$BRANCH_TAG"
            docker push "$IMAGE_NAME:$BRANCH_TAG"
          fi

          # Release tags (stable, beta, preview) come from tools/release_tags.py.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            while read -r release_tag; do
              docker tag unnamed_tracking_app:ci "$IMAGE_NAME:$release_tag"
              docker push "$IMAGE_NAME:$release_tag"
            done < <(python3 tools/release_tags.py "$GITHUB_REF_NAME")
          fi

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker ps -a
          docker logs unnamed-tracking-app || true
          docker logs unnamed-tracking-db || true
