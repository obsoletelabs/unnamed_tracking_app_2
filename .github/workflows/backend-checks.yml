name: Backend checks
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend-tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: unnamed_tracking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d unnamed_tracking_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: src/backend

    env:
      PYTHONPATH: ${{ github.workspace }}/src/backend
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/unnamed_tracking_test
      PRIMARY_USER_USERNAME: test
      PRIMARY_USER_EMAIL: test@example.com
      PRIMARY_USER_PASSWORD: test-password
      SECRET_KEY: XJVqc8r7Uj801VzGUYhlQV8A2tZTBepjOYEiP2pTzFk=

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare test database
        run: alembic upgrade head 2>&1 | tee migrations-output.txt

      - name: Run tests
        run: |
          set -o pipefail
          pytest 2>&1 | tee pytest-output.txt

      # Repository-level tests of tools/ need the complete checkout, so they stay
      # outside the backend-only suite that the development container also runs.
      - name: Run repository-level tool tests
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          python -m pytest tools/tests/test_plugin_acceptance_acquisition.py 2>&1 \
            | tee src/backend/repository-pytest-output.txt

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            src/backend/pytest-output.txt
            src/backend/repository-pytest-output.txt
            src/backend/migrations-output.txt
          if-no-files-found: ignore

  backend-pylint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/pylint.yml

  # Preserve the required status name while each check runs independently.
  backend-checks:
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs:
      - backend-tests
      - migration-graph
      - backend-file-size
      - backend-mypy
      - plugin-runtime-tests
      - backend-pylint
    runs-on: ubuntu-latest
    steps:
      - name: Require every backend check to pass
        id: backend-result
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["CHECK_RESULTS"])
          failures = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          if failures:
              raise SystemExit(f"Backend checks did not all pass: {failures}")
          PY

      - name: Report to Actions Dashboard
        if: always() && vars.PUSH_TO_DISPLAY_ENABLED == 'true'
        uses: pushtodisplay/actions-dashboard@ce26532a36af079259315587543935064f22e6b4
        env:
          PUSH_TO_DISPLAY_API_KEY: ${{ secrets.PUSH_TO_DISPLAY_API_KEY }}
          PUSH_TO_DISPLAY_BOARD: ${{ vars.PUSH_TO_DISPLAY_BOARD }}
        with:
          steps-json: ${{ toJSON(steps) }}
          panel-id: 2
          label: Backend CI

  migration-graph:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Alembic migration graph
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/changed-files
        id: changes
      - name: Set up Python
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Alembic migration graph
        if: steps.changes.outputs.backend == 'true'
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          versions = Path("src/database/migrations/versions")
          revisions = {}
          for path in sorted(versions.glob("*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              revision = None
              down_revision = None
              for node in tree.body:
                  if isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name):
                      name = node.target.id
                      if name in {"revision", "down_revision"}:
                          value = ast.literal_eval(node.value)
                          if name == "revision":
                              revision = value
                          else:
                              down_revision = value
                  elif isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id in {"revision", "down_revision"}:
                              value = ast.literal_eval(node.value)
                              if target.id == "revision":
                                  revision = value
                              else:
                                  down_revision = value
              if revision:
                  parents = [] if down_revision is None else list(down_revision) if isinstance(down_revision, tuple) else [down_revision]
                  revisions[revision] = (path.name, parents)

          print("Loaded", len(revisions), "Alembic revisions")
          missing = sorted({parent for _, parents in revisions.values() for parent in parents if parent not in revisions})
          if missing:
              raise SystemExit(f"Missing Alembic parent revisions: {missing}")

          state = {}
          stack = []

          def visit(revision):
              state[revision] = 1
              stack.append(revision)
              for parent in revisions[revision][1]:
                  if state.get(parent) == 1:
                      cycle_start = stack.index(parent)
                      cycle = stack[cycle_start:] + [parent]
                      print("Alembic cycle detected:")
                      for item in cycle:
                          print("  ", item, "<-", revisions[item][1])
                      raise SystemExit("Alembic migration graph contains a cycle")
                  if state.get(parent, 0) == 0:
                      visit(parent)
              stack.pop()
              state[revision] = 2

          for revision in revisions:
              if state.get(revision, 0) == 0:
                  visit(revision)

          children = {revision: 0 for revision in revisions}
          for _, parents in revisions.values():
              for parent in parents:
                  children[parent] += 1
          heads = sorted(revision for revision, count in children.items() if count == 0)
          print("Alembic heads:", heads)
          if len(heads) != 1:
              raise SystemExit(f"Expected exactly one Alembic head, found {len(heads)}: {heads}")
          PY

  backend-file-size:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Backend file size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed backend file sizes
        run: python3 tools/ci_checks.py backend-size

  backend-mypy:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Backend mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/changed-files
        id: changes
      - name: Set up Python
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - name: Install backend dependencies
        if: steps.changes.outputs.backend == 'true'
        run: python -m pip install -r requirements.txt
      - name: Run mypy
        run: |
          set -o pipefail
          python3 ../../tools/ci_checks.py backend-typecheck 2>&1 | tee mypy-output.txt
      - name: Upload mypy diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mypy-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/backend/mypy-output.txt
          if-no-files-found: ignore

  plugin-runtime-tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Plugin runtime policy tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/plugin-runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r ../backend/requirements.txt
      - name: Test plugin runtime policy
        run: PYTHONPATH=. pytest -q tests 2>&1 | tee pytest-output.txt
      - name: Upload plugin runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-runtime-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/plugin-runtime/pytest-output.txt
          if-no-files-found: ignore
