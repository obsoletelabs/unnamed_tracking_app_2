name: pylint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pylint:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src/backend
    defaults:
      run:
        shell: bash
        working-directory: src/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/changed-files
        id: changes
      - name: Set up Python
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - name: Install backend dependencies
        if: steps.changes.outputs.backend == 'true'
        run: python -m pip install -r requirements.txt
      - name: Enforce Pylint 10/10
        run: |
          set -o pipefail
          python3 ../../tools/ci_checks.py backend-pylint 2>&1 | tee pylint-output.txt
      - name: Upload Pylint diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pylint-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/backend/pylint-output.txt
          if-no-files-found: ignore
