name: temporary resolve PR 230

on:
  push:
    branches:
      - claude/issue-63-plugin-update-notification-history-and-deep-links

permissions:
  contents: write

jobs:
  resolve:
    if: ${{ !contains(github.event.head_commit.message, '[merge-resolved]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/issue-63-plugin-update-notification-history-and-deep-links
          fetch-depth: 0
      - name: Merge target with PR changes preferred on conflicts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin claude/issue-115-versioned-plugin-notification-contract
          git merge --no-edit -X ours origin/claude/issue-115-versioned-plugin-notification-contract
          git rm .github/workflows/_temporary_resolve_pr230.yml
          git commit --amend --no-edit -m 'Merge target branch into PR 230 [merge-resolved]'
          git push origin HEAD:claude/issue-63-plugin-update-notification-history-and-deep-links
