# Example Prometheus scrape configuration for Unnamed Tracking.
# See wiki/docs/deployment/metrics.md for how the token is generated and where to find it.
global:
  scrape_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  # Production image: the scrape port (METRICS_LISTEN_PORT, default 9464) needs no token. It is
  # closed unless you publish it or share a Docker network with the container; only expose it to
  # a trusted network. The target is the container's service name (or host) and that port.
  - job_name: unnamed-tracking
    metrics_path: /metrics
    static_configs:
      - targets: ["unnamed-tracking:9464"]

  # Development stack (compose.yaml): the backend container serves /metrics itself on 8000.
  # Use this job instead of the one above when running the split frontend/backend images.
  # - job_name: unnamed-tracking-dev
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["backend:8000"]
  #   authorization:
  #     type: Bearer
  #     credentials_file: /etc/prometheus/unnamed-tracking-metrics-token
