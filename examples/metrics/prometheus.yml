# Example Prometheus scrape configuration for Unnamed Tracking.
# See wiki/docs/deployment/metrics.md. The token is the application's METRICS_TOKEN.
global:
  scrape_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: unnamed-tracking
    metrics_path: /metrics
    # Development stack: scrape the backend container on the internal network.
    # Production image: set METRICS_LISTEN_PORT (for example 9464) and scrape that port.
    static_configs:
      - targets: ["backend:8000"]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/unnamed-tracking-metrics-token
